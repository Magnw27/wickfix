name: Apply WickAI UX layer

on:
  push:
    branches:
      - upgrade/ui-overhaul-v2

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject UX script into app shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text()
          tag = '<script src="/ux-overhaul.js?v=1"></script>'
          if tag not in s:
              marker = '<script src="/app.js?v=10"></script>'
              if marker not in s:
                  raise SystemExit('app.js script marker not found')
              s = s.replace(marker, marker + '\n  ' + tag, 1)
              p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then
            echo 'UX layer already injected'
            exit 0
          fi
          git commit -m 'chore(ui): load UX reliability layer'
          git push
